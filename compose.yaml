services:
  openfeed:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - openfeed-data:/data
    environment:
      OPENFEED_EXPERIMENTAL_BROWSER: "0"
      OPENFEED_BROWSER_NETWORK_ISOLATED: "0"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 160
    mem_limit: 512m
volumes:
  openfeed-data:
