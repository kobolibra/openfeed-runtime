name: Private bounded multi-source batch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: openfeed-private-state-writer
  cancel-in-progress: false
jobs:
  shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: shadow-state
          path: private-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runtime.lock
      - name: Run bounded tick and durable private checkpoint
        env:
          RUN_ID: ${{ github.run_id }}
        run: python ops/cloud_tick.py --run-id "$RUN_ID"
