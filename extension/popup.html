body{font:13px system-ui;background:#f8faf8;color:#1a3029;width:320px;padding:15px;margin:0}h1{font-size:16px}button{padding:10px;border:1px solid #c3d3ca;border-radius:8px;background:white;cursor:pointer}button:hover{background:#e7f1eb}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}input{box-sizing:border-box;padding:9px;width:100%;margin:9px 0;border:1px solid #c3d3ca;border-radius:7px}.actions{display:flex;gap:5px;margin:12px 0}#status{font-size:12px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#3a6655}.primary{background:#153e31;color:white}
